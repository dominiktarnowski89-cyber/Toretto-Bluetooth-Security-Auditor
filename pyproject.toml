[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toretto-bluetooth-security-auditor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7", "bleak>=0.22"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
toretto-bt-auditor = "toretto_bluetooth_auditor.app:main"
toretto-bt-auditor-cli = "toretto_bluetooth_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "I", "B", "UP"]
